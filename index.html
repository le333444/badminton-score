<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>羽毛球计分器</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<style>
  :root{
    --bg:#0d1117;
    --panel-a:#1d4ed8;
    --panel-a-hi:#2f6bff;
    --panel-a-dim:#132a63;
    --panel-b:#c2410c;
    --panel-b-hi:#f97316;
    --panel-b-dim:#5c2408;
    --ink:#f5f7fa;
    --muted:#93a1b5;
    --card:#161c26;
    --line:#273040;
    --ok:#22c55e;
    --gold:#fbbf24;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    touch-action:manipulation;
  }
  #app{
    position:fixed;inset:0;display:flex;flex-direction:column;
    padding:calc(var(--safe-t) + 6px) calc(var(--safe-r) + 8px) calc(var(--safe-b) + 8px) calc(var(--safe-l) + 8px);
    gap:6px;
  }

  /* ---------- 顶栏 ---------- */
  .topbar{display:flex;align-items:center;gap:10px;padding:2px 4px;flex:0 0 auto;}
  .title{font-size:15px;font-weight:700;letter-spacing:.5px;}
  .subtitle{font-size:12px;color:var(--muted);}
  .spacer{flex:1;}
  .iconbtn{
    appearance:none;border:1px solid var(--line);background:#1b2230;color:var(--ink);
    height:38px;min-width:38px;padding:0 12px;border-radius:11px;font-size:14px;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;
  }
  .iconbtn:active{background:#232c3d;transform:scale(.96);}
  .iconbtn.warn{color:#fca5a5;}

  /* ---------- 比分面板 ---------- */
  .panels{flex:1 1 auto;display:flex;gap:8px;min-height:0;}
  .panel{
    flex:1 1 0;position:relative;border-radius:22px;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:2px solid transparent;touch-action:manipulation;
    transition:border-color .18s, box-shadow .18s;
    padding:44px 6px calc(46px + var(--safe-b));
  }
  .panel.a{background:radial-gradient(120% 90% at 50% 105%, var(--panel-a-hi) 0%, var(--panel-a) 45%, var(--panel-a-dim) 100%);}
  .panel.b{background:radial-gradient(120% 90% at 50% 105%, var(--panel-b-hi) 0%, var(--panel-b) 45%, var(--panel-b-dim) 100%);}
  .panel.serving{border-color:var(--gold);box-shadow:inset 0 0 0 2px rgba(251,191,36,.35), 0 0 26px rgba(251,191,36,.28);}
  .panel.pulse{animation:pulse .3s ease-out;}
  @keyframes pulse{0%{filter:brightness(1.35);transform:scale(.995);}100%{filter:brightness(1);transform:scale(1);}}

  .teamname{
    font-size:clamp(12px,3.6vw,16px);font-weight:700;letter-spacing:2px;
    color:rgba(255,255,255,.82);text-transform:uppercase;margin-bottom:2px;
  }
  .servechip{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;
    background:var(--gold);color:#3b2600;border:none;opacity:0;transition:opacity .18s;
    pointer-events:auto;
  }
  .panel.serving .servechip{opacity:1;}
  .score{
    font-size:min(30vh,24vw);line-height:1;font-weight:800;
    font-variant-numeric:tabular-nums;letter-spacing:-.03em;
    text-shadow:0 6px 24px rgba(0,0,0,.35);pointer-events:none;
  }
  .tapme{
    position:absolute;bottom:12px;left:0;right:0;text-align:center;
    font-size:12px;color:rgba(255,255,255,.6);pointer-events:none;
  }
  .side-adjust{position:absolute;bottom:8px;display:flex;gap:8px;opacity:.85;}
  .side-adjust.left{left:10px;}
  .side-adjust.right{right:10px;}
  .adj{
    width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);
    background:rgba(0,0,0,.22);color:#fff;font-size:18px;font-weight:700;line-height:1;
  }
  .adj:active{background:rgba(0,0,0,.45);}

  /* 中间控制条 */
  .midbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;}
  .midbar .iconbtn{height:34px;font-size:13px;}
  .center-note{font-size:12px;color:var(--muted);min-width:84px;text-align:center;}

  /* ---------- 设置面板 ---------- */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;}
  .scrim.show{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:21;
    background:var(--card);border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding:14px 16px calc(18px + var(--safe-b));
    transform:translateY(110%);transition:transform .26s ease;
    max-height:82vh;overflow:auto;
  }
  .sheet.show{transform:translateY(0);}
  .sheet h2{margin:2px 0 14px;font-size:16px;}
  .sheet h2 small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .row:last-of-type{border-bottom:none;}
  .row .lab{font-size:14px;}
  .row .lab small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px;}
  .switch{position:relative;width:52px;height:30px;flex:0 0 auto;}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;}
  .track{position:absolute;inset:0;border-radius:999px;background:#39445a;transition:background .2s;}
  .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;}
  .switch input:checked + .track{background:var(--ok);}
  .switch input:checked + .track .knob{transform:translateX(22px);}
  .seg{display:flex;background:#0f141d;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;}
  .seg button{
    appearance:none;border:none;background:transparent;color:var(--muted);
    padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:600;
  }
  .seg button.on{background:#33415a;color:#fff;}
  input[type=range]{width:130px;accent-color:var(--ok);}
  .btnrow{display:flex;gap:10px;margin-top:14px;}
  .btn{
    flex:1;appearance:none;border:1px solid var(--line);background:#1b2230;color:var(--ink);
    border-radius:12px;padding:12px;font-size:14px;font-weight:600;
  }
  .btn.primary{background:var(--ok);border-color:var(--ok);color:#04240f;}
  .btn.danger{color:#fca5a5;}
  .btn:active{transform:scale(.98);}
  .hint{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.6;}

  /* ---------- 结束提示 ---------- */
  .banner{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
    width:min(88vw,380px);z-index:30;background:var(--card);
    border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .22s, transform .22s;
    box-shadow:0 24px 60px rgba(0,0,0,.6);
  }
  .banner.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
  .banner .big{font-size:22px;font-weight:800;margin-bottom:6px;}
  .banner .mid{color:var(--muted);font-size:13.5px;margin-bottom:16px;white-space:pre-line;}

  /* 提示条 */
  .toast{
    position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);
    background:rgba(0,0,0,.82);border:1px solid var(--line);color:#fff;
    padding:9px 16px;border-radius:999px;font-size:13px;z-index:40;
    opacity:0;pointer-events:none;transition:opacity .22s;max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;}

  /* 横屏：中间条移到右侧窄列 */
  @media (orientation:landscape) and (max-height:520px){
    .title,.subtitle{display:none;}
    .score{font-size:min(34vh,20vw);}
    .sheet{max-height:92vh;}
  }
  @media (min-width:760px){
    .panels{max-width:900px;width:100%;margin:0 auto;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div>
      <div class="title">羽毛球计分器</div>
      <div class="subtitle" id="ruleText">21 分制 · 领先 2 分胜</div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnUndo" title="撤销上一分">↩︎ 撤销</button>
    <button class="iconbtn" id="btnSound" title="语音播报开关">🔊 语音</button>
    <button class="iconbtn" id="btnSettings" title="设置">⚙️</button>
  </div>

  <div class="panels">
    <div class="panel a" id="panelA">
      <div class="teamname" id="nameA">A 队</div>
      <button class="servechip" id="chipA" data-serve="A">发球</button>
      <div class="score" id="scoreA">0</div>
      <div class="side-adjust left">
        <button class="adj" data-side="A" data-delta="-1" aria-label="A 队减一分">−</button>
      </div>
      <div class="tapme">点击加 1 分</div>
    </div>

    <div class="panel b" id="panelB">
      <div class="teamname" id="nameB">B 队</div>
      <button class="servechip" id="chipB" data-serve="B">发球</button>
      <div class="score" id="scoreB">0</div>
      <div class="side-adjust right">
        <button class="adj" data-side="B" data-delta="-1" aria-label="B 队减一分">−</button>
      </div>
      <div class="tapme">点击加 1 分</div>
    </div>
  </div>

  <div class="midbar">
    <button class="iconbtn" id="btnServe">🏸 切换发球方</button>
    <div class="center-note" id="gameNote">第 1 局</div>
    <button class="iconbtn" id="btnReset">🔄 重新开始</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet">
  <h2>设置 <small>自动保存在本机浏览器</small></h2>

  <div class="row">
    <div class="lab">语音播报<small>每次加分后朗读当前比分</small></div>
    <label class="switch"><input type="checkbox" id="optSound"><span class="track"><span class="knob"></span></span></label>
  </div>

  <div class="row">
    <div class="lab">播报节奏<small>语速快慢</small></div>
    <input type="range" id="optRate" min="0.6" max="1.4" step="0.05">
  </div>

  <div class="row">
    <div class="lab">计分规则</div>
    <div class="seg" id="segRule">
      <button data-win="21" data-cap="30" class="on">羽毛球 21</button>
      <button data-win="11" data-cap="11">乒乓 11</button>
      <button data-win="15" data-cap="21">15 分</button>
    </div>
  </div>

  <div class="row">
    <div class="lab">队名</div>
    <div style="display:flex;gap:8px;">
      <input id="inpA" maxlength="6" placeholder="A 队" style="width:76px;padding:9px;border-radius:10px;border:1px solid var(--line);background:#0f141d;color:#fff;font-size:14px;text-align:center;">
      <input id="inpB" maxlength="6" placeholder="B 队" style="width:76px;padding:9px;border-radius:10px;border:1px solid var(--line);background:#0f141d;color:#fff;font-size:14px;text-align:center;">
    </div>
  </div>

  <div class="btnrow">
    <button class="btn" id="btnTest">🔈 试听播报</button>
    <button class="btn primary" id="btnClose">完成</button>
  </div>
  <div class="btnrow">
    <button class="btn" id="btnNewGame">开始新的一局</button>
    <button class="btn danger" id="btnFullReset">归零全场</button>
  </div>

  <div class="hint" id="hintText">
    小提示：手机请把媒体音量调大、并关闭静音开关；首次点一下任意按钮即可解锁语音。
  </div>
</div>

<div class="banner" id="banner">
  <div class="big" id="bannerTitle">A 队 胜</div>
  <div class="mid" id="bannerSub"></div>
  <div class="btnrow">
    <button class="btn" id="btnEndMatch">结束</button>
    <button class="btn primary" id="btnNextGame">下一局</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ============ 数字 / 分数 中文读法 ============ */
var CN = ['零','一','二','三','四','五','六','七','八','九'];
function num2cn(n){
  n = Math.round(n);
  if (n < 0) return '负' + num2cn(-n);
  if (n < 10) return CN[n];
  if (n === 10) return '十';
  if (n < 20) return '十' + CN[n % 10];
  var t = Math.floor(n / 10), o = n % 10;
  return CN[t] + '十' + (o ? CN[o] : '');
}
function sayScoreText() {
  var a = S.a, b = S.b;
  if (a === b) return num2cn(a) + '平';
  var hi = Math.max(a, b), lo = Math.min(a, b);
  // 19 平之后按真实数字读，例如“二十比十九”，避免读成“二十比九”产生歧义
  var deuce = (a >= S.win - 1 && b >= S.win - 1);
  var low = (lo >= 10 && deuce) ? num2cn(lo) : CN[lo];
  return num2cn(hi) + '比' + low + '，' + (a > b ? nameOf('A') : nameOf('B')) + '领先';
}
var CN_NAME = { A: 'A队', B: 'B队' };
function nameOf(side){ return S.name[side] || CN_NAME[side]; }

/* ============ 状态 ============ */
var LS_KEY = 'dsh.badminton.score.v1';
var S = {
  a: 0, b: 0,
  win: 21, cap: 30,
  games: [],          // 已结束的局 [{a,b,winner}]
  gameNo: 1,
  serve: 'A',
  autoServe: true,
  name: { A: 'A 队', B: 'B 队' },
  sound: true,
  rate: 1.0
};
var history = [];
var gameOver = false;

/* ============ 存取 ============ */
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
}
function load(){
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    var o = JSON.parse(raw);
    if (o && typeof o === 'object') {
      S.a = o.a | 0; S.b = o.b | 0;
      S.win = o.win || 21; S.cap = o.cap || 30;
      S.games = Array.isArray(o.games) ? o.games : [];
      S.gameNo = o.gameNo || (S.games.length + 1);
      S.serve = (o.serve === 'B') ? 'B' : 'A';
      S.autoServe = o.autoServe !== false;
      S.name = { A: (o.name && o.name.A) || 'A 队', B: (o.name && o.name.B) || 'B 队' };
      S.sound = o.sound !== false;
      S.rate = typeof o.rate === 'number' ? o.rate : 1.0;
    }
  } catch (e) {}
}

/* ============ 语音 ============ */
var speechOK = !!window.speechSynthesis && typeof window.SpeechSynthesisUtterance === 'function';
var voices = [];
var zhVoice = null;
function pickVoice(){
  try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; }
  zhVoice = null;
  for (var i = 0; i < voices.length; i++) {
    var v = voices[i], lang = (v.lang || '').toLowerCase(), nm = (v.name || '');
    if (lang.indexOf('zh') === 0 || lang.indexOf('cmn') === 0) { zhVoice = v; break; }
    if (/Chinese|Tingting|Meijia|Yaoyao|Xiaoxiao|Huihui|Kangkang|Mandarin/i.test(nm)) { zhVoice = v; break; }
  }
}
if (window.speechSynthesis) {
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
  setTimeout(pickVoice, 400);
  setTimeout(pickVoice, 1500);
}
function speak(text){
  if (!S.sound || !window.speechSynthesis || !text) return;
  try {
    var synth = window.speechSynthesis;
    synth.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    if (zhVoice) u.voice = zhVoice;
    u.rate = S.rate;
    u.pitch = 1;
    u.volume = 1;
    synth.speak(u);
  } catch (e) {
    // 某些浏览器首次调用需要用户手势，这里静默失败
  }
}
function announce(text, delay){
  if (!S.sound || !text) return;
  if (delay) { setTimeout(function(){ speak(text); }, delay); return; }
  speak(text);
}

/* ============ 界面元素 ============ */
var $ = function(id){ return document.getElementById(id); };
var elPanelA = $('panelA'), elPanelB = $('panelB');
var elScoreA = $('scoreA'), elScoreB = $('scoreB');
var elRuleText = $('ruleText'), elGameNote = $('gameNote');
var elBanner = $('banner'), elBannerTitle = $('bannerTitle'), elBannerSub = $('bannerSub');
var elToast = $('toast'), elScrim = $('scrim'), elSheet = $('sheet');
var elBtnSound = $('btnSound'), elOptSound = $('optSound');

function render(){
  elScoreA.textContent = S.a;
  elScoreB.textContent = S.b;
  $('nameA').textContent = S.name.A;
  $('nameB').textContent = S.name.B;
  elRuleText.textContent = S.win + ' 分制 · ' + (S.cap > S.win ? ('领先 2 分胜，' + S.cap + ' 分封顶') : '先到 ' + S.win + ' 分胜');
  elGameNote.textContent = '第 ' + S.gameNo + ' 局' + (S.games.length ? (' · ' + S.games.map(function(g){ return g.a + ':' + g.b; }).join('  ')) : '');
  elPanelA.classList.toggle('serving', S.serve === 'A');
  elPanelB.classList.toggle('serving', S.serve === 'B');
  elBtnSound.textContent = S.sound ? '🔊 语音' : '🔇 静音';
  elBtnSound.style.opacity = S.sound ? '1' : '.6';
  elOptSound.checked = S.sound;
  $('inpA').placeholder = 'A 队';
  $('inpB').placeholder = 'B 队';
}

var toastTimer = null;
function toast(msg, ms){
  elToast.textContent = msg;
  elToast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ elToast.classList.remove('show'); }, ms || 1600);
}
function vibrate(p){
  if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} }
}
function pulse(el){
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
}

/* ============ 计分逻辑 ============ */
function snapshot(){
  return { a: S.a, b: S.b, serve: S.serve, autoServe: S.autoServe, games: S.games.slice(), gameNo: S.gameNo, gameOver: gameOver };
}
function pushHistory(){
  history.push(snapshot());
  if (history.length > 200) history.shift();
}
function winnerOf(a, b){
  var w = S.win, cap = S.cap;
  if (a >= cap || b >= cap) return a > b ? 'A' : 'B';   // 封顶分
  var need = w;
  if (a >= need && a - b >= 2) return 'A';
  if (b >= need && b - a >= 2) return 'B';
  if (cap <= w) {
    if (a >= w) return 'A';
    if (b >= w) return 'B';
  }
  return null;
}
function addPoint(side){
  if (gameOver) { toast('本局已结束，点“下一局”继续'); return; }
  pushHistory();
  S[side === 'A' ? 'a' : 'b'] += 1;
  S.serve = side;                    // 得分方发球
  S.autoServe = true;
  pulse(side === 'A' ? elPanelA : elPanelB);
  vibrate(18);
  render();
  save();

  var w = winnerOf(S.a, S.b);
  if (w) {
    announce(sayScoreText() + '，' + nameOf(w) + '胜', 260);
    finishGame(w);
    return;
  }
  announce(sayScoreText(), 160);
}
function finishGame(w){
  gameOver = true;
  S.games.push({ a: S.a, b: S.b, winner: w });
  save();
  elBannerTitle.textContent = nameOf(w) + ' 胜';
  var detail = S.games.map(function(g, i){ return '第' + (i + 1) + '局 ' + g.a + ' : ' + g.b; }).join('\n');
  elBannerSub.textContent = detail;
  elBanner.classList.add('show');
  if (S.sound) announce('本局结束，' + nameOf(w) + '获胜', 1500);
}
function nextGame(){
  elBanner.classList.remove('show');
  gameOver = false;
  var last = S.games[S.games.length - 1];
  S.a = 0; S.b = 0;
  S.gameNo = S.games.length + 1;
  if (last) { S.serve = last.winner; S.autoServe = true; }   // 上局胜方先发球
  history = [];
  render(); save();
  announce('第' + num2cn(S.gameNo) + '局开始，' + nameOf(S.serve) + '发球', 200);
}
function endMatch(){
  elBanner.classList.remove('show');
  toast('比赛已结束，可点“重新开始”开启新一场');
}
function fullReset(){
  if (S.a || S.b || S.games.length) {
    if (!window.confirm('确定把比分和所有局分归零吗？')) return;
  }
  S.a = 0; S.b = 0; S.games = []; S.gameNo = 1; S.serve = 'A'; S.autoServe = true;
  gameOver = false; history = [];
  elBanner.classList.remove('show');
  render(); save();
  toast('已归零');
}
function happyReset(){
  if (S.a || S.b) {
    if (!window.confirm('重新开始本局？当前比分将清零。')) return;
  }
  S.a = 0; S.b = 0; gameOver = false; history = [];
  elBanner.classList.remove('show');
  render(); save();
  toast('本局已重新开始');
}
function undo(){
  if (!history.length) { toast('没有可撤销的操作'); return; }
  var s = history.pop();
  S.a = s.a; S.b = s.b; S.serve = s.serve; S.autoServe = s.autoServe;
  S.games = s.games; S.gameNo = s.gameNo; gameOver = s.gameOver;
  elBanner.classList.remove('show');
  render(); save();
  toast('已撤销 · ' + S.a + ' : ' + S.b);
  announce(sayScoreText(), 120);
}
function toggleSound(){
  S.sound = !S.sound;
  render(); save();
  if (S.sound) { announce('语音播报已开启', 0); toast('语音播报已开启'); }
  else { try { window.speechSynthesis.cancel(); } catch (e) {} toast('语音播报已关闭'); }
}

/* ============ 事件绑定 ============ */
function bindTap(el, fn){
  var fired = false;
  el.addEventListener('pointerdown', function(ev){
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    fired = true;
    fn(ev);
  });
  el.addEventListener('click', function(ev){
    if (fired) { fired = false; return; }   // 已由 pointerdown 处理，避免重复
    fn(ev);
  });
  el.addEventListener('dblclick', function(ev){ ev.preventDefault(); });
}

bindTap(elPanelA, function(){ addPoint('A'); });
bindTap(elPanelB, function(){ addPoint('B'); });
['chipA', 'chipB'].forEach(function(id){
  var el = $(id);
  el.addEventListener('pointerdown', function(ev){ ev.stopPropagation(); setServe(id === 'chipA' ? 'A' : 'B'); });
  el.addEventListener('click', function(ev){ ev.stopPropagation(); });
});
Array.prototype.forEach.call(document.querySelectorAll('.adj'), function(btn){
  bindTap(btn, function(ev){
    ev.stopPropagation();
    var side = btn.getAttribute('data-side');
    var cur = S[side === 'A' ? 'a' : 'b'];
    if (cur <= 0) { toast(nameOf(side) + ' 已是 0 分'); return; }
    pushHistory();
    S[side === 'A' ? 'a' : 'b'] = cur - 1;
    gameOver = false;
    elBanner.classList.remove('show');
    render(); save();
  });
});
function setServe(side){
  S.serve = side; S.autoServe = false;
  render(); save();
  toast(nameOf(side) + ' 发球');
}

bindTap($('btnUndo'), undo);
bindTap($('btnSound'), toggleSound);
bindTap($('btnSettings'), function(){ elScrim.classList.add('show'); elSheet.classList.add('show'); });
bindTap($('btnClose'), function(){ elScrim.classList.remove('show'); elSheet.classList.remove('show'); });
bindTap($('btnReset'), happyReset);
bindTap($('btnServe'), function(){
  S.serve = (S.serve === 'A') ? 'B' : 'A';
  S.autoServe = false;
  render(); save();
  toast('发球方：' + nameOf(S.serve));
});
bindTap($('btnTest'), function(){ speak('测试播报，当前比分，' + sayScoreText()); });
bindTap($('btnNewGame'), function(){ elScrim.classList.remove('show'); elSheet.classList.remove('show'); nextGame(); });
bindTap($('btnFullReset'), function(){ fullReset(); });
bindTap($('btnNextGame'), nextGame);
bindTap($('btnEndMatch'), endMatch);
elScrim.addEventListener('click', function(){ elScrim.classList.remove('show'); elSheet.classList.remove('show'); });

/* 设置项 */
elOptSound.addEventListener('change', function(){
  S.sound = elOptSound.checked; render(); save();
  if (S.sound) speak('语音播报已开启');
});
$('optRate').addEventListener('input', function(){
  S.rate = parseFloat(this.value) || 1; save();
});
Array.prototype.forEach.call(document.querySelectorAll('#segRule button'), function(b){
  b.addEventListener('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('#segRule button'), function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    S.win = parseInt(b.getAttribute('data-win'), 10);
    S.cap = parseInt(b.getAttribute('data-cap'), 10);
    S.a = 0; S.b = 0; gameOver = false; history = [];
    elBanner.classList.remove('show');
    render(); save();
    toast('已切换为 ' + S.win + ' 分制');
  });
});
$('inpA').addEventListener('input', function(){ S.name.A = (this.value || 'A 队').slice(0, 6); render(); save(); });
$('inpB').addEventListener('input', function(){ S.name.B = (this.value || 'B 队').slice(0, 6); render(); save(); });

/* 键盘快捷键（电脑上测试方便，不影响手机） */
window.addEventListener('keydown', function(ev){
  if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
  var k = ev.key.toLowerCase();
  if (k === 'a' || ev.key === 'ArrowLeft') { addPoint('A'); }
  else if (k === 'b' || ev.key === 'ArrowRight') { addPoint('B'); }
  else if (k === 'z') { undo(); }
  else if (k === 'm') { toggleSound(); }
});

/* 防止双指缩放 / 双击缩放 */
document.addEventListener('gesturestart', function(ev){ ev.preventDefault(); });
var lastTouchEnd = 0;
document.addEventListener('touchend', function(ev){
  var now = Date.now();
  if (now - lastTouchEnd <= 320) ev.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });

/* 屏幕常亮（支持的浏览器自动开启） */
var wakeLock = null;
function keepAwake(){
  if (!navigator.wakeLock || !navigator.wakeLock.request) return;
  navigator.wakeLock.request('screen').then(function(l){ wakeLock = l; }).catch(function(){});
}
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible') { keepAwake(); pickVoice(); }
});

/* ============ 启动 ============ */
load();
render();
$('inpA').value = S.name.A === 'A 队' ? '' : S.name.A;
$('inpB').value = S.name.B === 'B 队' ? '' : S.name.B;
$('optRate').value = S.rate;
if (S.win === 11) { document.querySelectorAll('#segRule button').forEach(function(b,i){ b.classList.toggle('on', i === 1); }); }
else if (S.win === 15) { document.querySelectorAll('#segRule button').forEach(function(b,i){ b.classList.toggle('on', i === 2); }); }
if (S.games.length && S.a === 0 && S.b === 0) gameOver = false;

/* 首次交互解锁语音（iOS 需要） */
function unlockAudio(){
  if (!speechOK) {
    toast('当前浏览器不支持语音播报，请用 Safari / Chrome 打开', 3200);
  } else {
    try {
      pickVoice();
      var u = new SpeechSynthesisUtterance(' ');
      u.volume = 0; u.lang = 'zh-CN';
      if (zhVoice) u.voice = zhVoice;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  keepAwake();
  document.removeEventListener('pointerdown', unlockAudio);
  document.removeEventListener('touchstart', unlockAudio);
}
document.addEventListener('pointerdown', unlockAudio, { once: true });
document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });

if (!speechOK) {
  elOptSound.disabled = true;
  $('hintText').textContent = '当前浏览器不支持语音合成，比分仍可正常记录；建议用手机自带 Safari / Chrome 打开本页。';
}

toast('点左边/右边区域加 1 分');
})();
</script>
</body>
</html>
